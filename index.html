g('Piutang',[['Saldo Piutang Member','piu'],['Kartu Piutang per Member','kpm'],['Pelunasan Piutang','pelr']])];
const t=MN[2][1];t.splice(t.findIndex(x=>x&&x[1]=='buy')+1,0,['Cari / Riwayat Pembelian','fb']);MN[0][1][1][0]='Cari / Riwayat Penjualan';
const w=a=>a.forEach(i=>{if(i)Array.isArray(i[1])?w(i[1]):TT[i[1]]=i[0]});w(MN.flatMap(x=>x[1]||[]))})();
const sx=(e,el)=>{e.stopPropagation();el.parentElement.classList.toggle('open')};
/* ===== OPNAME, PENYESUAIAN, KONVERSI (banyak barang), MASTER LENGKAP, DONASI/VOUCHER ===== */
const qb=k=>`<div class=cd><input placeholder="Cari..." value="${F(k).q}" onchange="F('${k}').q=this.value;go()"></div>`;
const dtl=(id,h,rows,hd)=>dlg(`<h3>${id}</h3><p class=m>${h}</p>`+tb(hd,rows)+`<div class=ac><button class=bt onclick=cm()>Tutup</button></div>`);
const hdr=(f,extra)=>`<div class=cd><div class=gr><label>No. Bukti<input value="(otomatis)" disabled></label><label>Tanggal<input type=date value=${f.tgl} onchange="${f.v}.tgl=this.value"></label>${extra||''}</div>`;
const scn=(id,fn)=>`<input id=${id} style="max-width:320px" placeholder="Scan / ketik barcode lalu Enter" onkeydown="if(event.key=='Enter')${fn}(this.value)"></div>`;
const fnd=v=>{v=v.trim();return S.prod.find(x=>x.k==v)||S.prod.find(x=>v&&x.n.toLowerCase().includes(v.toLowerCase()))||(alert('Barang tidak ditemukan'),null)};
const foc=id=>setTimeout(()=>{const e=$('#'+id);e&&e.focus()},0);
/* STOK OPNAME */
let od=null;const nod=()=>({tgl:today(),ket:'',it:[],v:'od'});
VW.opn=()=>{od=od||nod();return hdr(od,`<label>Keterangan<input value="${od.ket}" onchange="od.ket=this.value"></label><label>Petugas<input value="${U.n}" disabled></label>`)+scn('oq','oa')+tb(['Barcode','Nama Brg.','Stok Sistem','Jumlah (Fisik)','Harga Pokok','Nilai Persediaan',''],od.it.map((x,i)=>[x.k,x.n,x.sis,`<input type=number value=${x.fis} style="width:80px" onchange="od.it[${i}].fis=+this.value||0;go()">`,rp(x.hb),rp(x.fis*x.hb),`<button class=bt onclick="od.it.splice(${i},1);go()">x</button>`]))+`<div class=ln><b>Total Persediaan</b><span class=tt>${rp(sm(od.it,x=>x.fis*x.hb))}</span></div><div class=ac><button class=bt onclick="od=nod();go()">New</button><button class="bt pr" onclick=ops()>Proses Stok Opname</button><button class=bt onclick="od=nod();go()">Cancel</button></div><h3 style="margin:10px 0">Riwayat Stok Opname</h3>`+tb(['No','Tanggal','Keterangan','Petugas','Item','Nilai Selisih',''],S.opd.slice().reverse().map(d=>[d.id,d.tgl,d.ket,d.by,d.it.length,rp(sm(d.it,x=>(x.fis-x.sis)*x.hb)),`<button class=bt onclick="odt('${d.id}')">Detail</button>`]))};
const oa=v=>{const p=fnd(v);if(!p)return;const x=od.it.find(y=>y.k==p.k);x?x.fis++:od.it.push({k:p.k,n:p.n,sis:p.s,fis:1,hb:p.b});go();foc('oq')};
const ops=()=>{if(!od.it.length)return alert('Belum ada barang');if(!confirm('Proses stok opname? Stok sistem disamakan dengan jumlah fisik (barang yang tidak ada di daftar tidak diubah).'))return;const id=pid('SO');od.it.forEach(x=>{const p=S.prod.find(q=>q.k==x.k);if(p){x.sis=p.s;S.op.push({tgl:od.tgl,n:p.n,sis:p.s,fis:x.fis,c:'Opname '+id});p.s=x.fis}});S.opd.push({id,tgl:od.tgl,ket:od.ket,by:U.n,it:od.it});sv();od=nod();alert('Stok opname '+id+' diproses');go()};
const odt=id=>{const d=S.opd.find(x=>x.id==id);dtl(d.id,d.tgl+' - '+d.ket,d.it.map(x=>[x.n,x.sis,x.fis,x.fis-x.sis]),['Barang','Sistem','Fisik','Selisih'])};
/* PENYESUAIAN PERSEDIAAN */
let ad=null;const nad=()=>({tgl:today(),kat:'Selisih Stok',ket:'',it:[],v:'ad'});
VW.adj=()=>{ad=ad||nad();return hdr(ad,`<label>Kategori<select onchange="ad.kat=this.value">${['Selisih Stok','Barang Rusak','Kadaluarsa','Hilang','Lainnya'].map(k=>`<option ${ad.kat==k?'selected':''}>${k}</option>`).join('')}</select></label><label>Keterangan<input value="${ad.ket}" onchange="ad.ket=this.value"></label>`)+scn('aq','aa')+tb(['Barcode','Nama Brg.','Stok Sistem','Selisih Stok (+/-)','Harga Pokok','Nilai Penyesuaian',''],ad.it.map((x,i)=>[x.k,x.n,pf(x.k).s,`<input type=number value=${x.sel} style="width:80px" onchange="ad.it[${i}].sel=+this.value||0;go()">`,rp(x.hb),rp(x.sel*x.hb),`<button class=bt onclick="ad.it.splice(${i},1);go()">x</button>`]))+`<div class=ln><b>Total Penyesuaian</b><span class=tt>${rp(sm(ad.it,x=>x.sel*x.hb))}</span></div><div class=ac><button class=bt onclick="ad=nad();go()">New</button><button class="bt pr" onclick=asv()>Save</button><button class=bt onclick="ad=nad();go()">Cancel</button></div><h3 style="margin:10px 0">Riwayat Penyesuaian</h3>`+tb(['No','Tanggal','Kategori','Keterangan','Item','Nilai',''],S.adj.slice().reverse().map(d=>[d.id,d.tgl,d.kat,d.ket,d.it.length,rp(sm(d.it,x=>x.sel*x.hb)),`<button class=bt onclick="adt('${d.id}')">Detail</button> <button class=bt onclick="adel('${d.id}')">Hapus</button>`]))};
const aa=v=>{const p=fnd(v);if(!p)return;const x=ad.it.find(y=>y.k==p.k);x?x.sel++:ad.it.push({k:p.k,n:p.n,sel:1,hb:p.b});go();foc('aq')};
const asv=()=>{if(!ad.it.length)return alert('Belum ada barang');const id=pid('AJ');if(!tx(()=>{for(const x of ad.it){const p=S.prod.find(q=>q.k==x.k);if(!p||p.s+x.sel<0)return false;p.s+=x.sel}S.adj.push({id,tgl:ad.tgl,kat:ad.kat,ket:ad.ket,it:ad.it.map(x=>({...x}))});return true}))return alert('Stok tidak boleh menjadi negatif');sv();ad=nad();go()};
const adt=id=>{const d=S.adj.find(x=>x.id==id);dtl(d.id,d.tgl+' - '+d.kat+' - '+d.ket,d.it.map(x=>[x.n,x.sel,rp(x.hb),rp(x.sel*x.hb)]),['Barang','Selisih','Harga Pokok','Nilai'])};
const adel=id=>{if(!confirm('Hapus penyesuaian ini? Stok dikembalikan.'))return;if(!tx(()=>{const d=S.adj.find(x=>x.id==id);for(const x of d.it){const p=S.prod.find(q=>q.k==x.k);if(p){p.s-=x.sel;if(p.s<0)return false}}S.adj=S.adj.filter(y=>y!=d);return true}))return alert('Stok sudah berubah; tidak bisa dibatalkan');sv();go()};
/* KONVERSI STOK */
let kd2=null;const nkd=()=>({tgl:today(),it:[],v:'kd2'});
VW.kv=()=>{kd2=kd2||nkd();return hdr(kd2)+`<button class="bt pr" onclick=kl()>+ Tambah Baris</button></div>`+tb(['Barcode','Nama Brg.','Qty','Menjadi Barcode','Menjadi Barang','Sejumlah',''],kd2.it.map((x,i)=>[x.ka,pf(x.ka).n,x.qa,x.kb,pf(x.kb).n,x.qb,`<button class=bt onclick="kd2.it.splice(${i},1);go()">x</button>`]))+`<div class=ac><button class=bt onclick="kd2=nkd();go()">New</button><button class="bt pr" onclick=ksv()>Save</button><button class=bt onclick="kd2=nkd();go()">Cancel</button></div><h3 style="margin:10px 0">Riwayat Konversi</h3>`+tb(['No','Tanggal','Dari','Qty','Menjadi','Sejumlah',''],S.kv.map((x,i)=>[x.did||'-',x.tgl,x.a,x.qa,x.b,x.qb,`<button class=bt onclick="kvD(${i})">Hapus</button>`]).reverse())};
const kl=()=>modal('Baris Konversi',[['a','Dari barang','select',S.prod[0]?.k,pS()],['qa','Qty','number',1],['b','Menjadi barang','select',S.prod[0]?.k,pS()],['qb','Sejumlah','number',1]],o=>{if(o.a==o.b||+o.qa<=0||+o.qb<=0)return alert('Data tidak valid'),false;kd2.it.push({ka:o.a,qa:+o.qa,kb:o.b,qb:+o.qb});go()});
const ksv=()=>{if(!kd2.it.length)return alert('Belum ada baris');const id=pid('KS');if(!tx(()=>{for(const x of kd2.it){const a=S.prod.find(p=>p.k==x.ka),b=S.prod.find(p=>p.k==x.kb);if(!a||!b||a.s<x.qa)return false;a.s-=x.qa;b.s+=x.qb;S.kv.push({did:id,tgl:kd2.tgl,ka:x.ka,kb:x.kb,a:a.n,qa:x.qa,b:b.n,qb:x.qb})}return true}))return alert('Stok barang asal tidak cukup');sv();kd2=nkd();alert('Konversi '+id+' tersimpan');go()};
const kvD=i=>{if(!confirm('Hapus baris konversi ini? Stok dikembalikan.'))return;if(!tx(()=>{const x=S.kv[i],a=S.prod.find(p=>p.n==x.a),b=S.prod.find(p=>p.n==x.b);if(!a||!b||b.s<x.qb)return false;a.s+=x.qa;b.s-=x.qb;S.kv.splice(i,1);return true}))return alert('Stok hasil konversi sudah terpakai; tidak bisa dibatalkan');sv();go()};
/* MASTER SUPPLIER */
VW.sup=()=>`<div class=hd><h2>Master Supplier</h2><button class="bt pr" onclick=esx()>+ Supplier</button></div>`+qb('sp')+tb(['Kode','Nama','Alamat','Kota','Telp / HP','Fax','Email','Kontak Person','Saldo Hutang',''],S.sup.map((s,i)=>[i,s]).filter(([i,s])=>hit('sp','',s.n,s.a,s.kota,s.cp)).map(([i,s])=>['SP-'+String(i+1).padStart(4,'0'),s.n,s.a||'',s.kota||'',s.t||'',s.fx||'',s.em||'',s.cp||'',rp(sm(S.buy.filter(b=>b.sup==s.n),b=>b.total-b.paid)),`<button class=bt onclick="esx(${i})">Ubah</button> <button class=bt onclick="dsx(${i})">Hapus</button>`]));
const esx=i=>{const s=S.sup[i]||{};modal(i==null?'Tambah Supplier':'Ubah Supplier',[['n','Nama','text',s.n||''],['a','Alamat','text',s.a||''],['kota','Kota','text',s.kota||''],['t','No. Telp / HP','text',s.t||''],['fx','Fax','text',s.fx||''],['em','Email','text',s.em||''],['cp','Kontak Person','text',s.cp||'']],o=>{if(!o.n)return false;const old=s.n;if(i==null)S.sup.push(o);else{S.sup[i]=o;if(old!=o.n){[S.buy,S.pay,S.rb,S.po].forEach(l=>l.forEach(x=>{if(x.sup==old)x.sup=o.n}))}}sv();go()})};
const dsx=i=>{const s=S.sup[i];if(S.buy.some(b=>b.sup==s.n))return alert('Supplier sudah punya transaksi pembelian; tidak bisa dihapus');if(confirm('Hapus supplier?')){S.sup.splice(i,1);sv();go()}};
/* MASTER MEMBER */
VW.mem=()=>`<div class=hd><h2>Master Member</h2><button class="bt pr" onclick=emx()>+ Member</button></div>`+qb('mm')+tb(['Kode','Nama','Alamat','Kota','Telp / HP','Kategori','Level Harga','Limit Piutang','Saldo Piutang','Saldo Poin',''],S.mem.map((m,i)=>[i,m]).filter(([i,m])=>hit('mm','',m.kode,m.n,m.a,m.kota,m.t)).map(([i,m])=>[m.kode,m.n,m.a||'',m.kota||'',m.t||'',m.kt||'-','Harga '+(m.lv||1),rp(m.lm||0),rp(sm(S.sale.filter(s=>s.mem==m.kode),sd)),m.p,`<button class=bt onclick="emx(${i})">Ubah</button>`]));
const emx=i=>{const m=S.mem[i]||{};modal(i==null?'Tambah Member':'Ubah Member',[['n','Nama','text',m.n||''],['a','Alamat','text',m.a||''],['kota','Kota','text',m.kota||''],['t','No. Telp / HP','text',m.t||''],['fx','Fax','text',m.fx||''],['em','Email','text',m.em||''],['kt','Kategori','select',m.kt||'',[['','- (tanpa kategori)'],...S.m.kmem.map(x=>[x.n,x.n])]],['lv','Level Harga','select',m.lv||'1',[['1','Harga 1'],['2','Harga 2'],['3','Harga 3']]],['lm','Limit Piutang (0 = tanpa batas)','number',m.lm||0]],o=>{if(!o.n)return false;o.lv=+o.lv;o.lm=+o.lm||0;i==null?S.mem.push({...o,kode:'M'+String(S.mem.length+1).padStart(4,'0'),p:0}):Object.assign(m,o);sv();go()})};
const lvp=p=>{const m=mm(),b=m&&m.lv==2?(p.h2||p.h):m&&m.lv==3?(p.h3||p.h):p.h;return Math.round(b*(1-(p.d||0)/100))};
const rpc=()=>{cart.forEach(x=>{const p=pf(x.k);if(p.k)x.h=lvp(p)});plist()};
/* LAPORAN TAMBAHAN */
RP.jsup=['Penjualan per Supplier',()=>gT(SI(),i=>pf(i.k).sp||'-',['Supplier','Qty','Omzet'],iq)];
RP.rdon=['Rekap Donasi',()=>{const l=S.ex.filter(x=>x.k=='Donasi'&&inr(x.tgl));return cards([['Total donasi',rp(sm(l,x=>x.amt))],['Jumlah donasi',l.length]])+tb(['Tanggal','Transaksi','Jumlah'],l.map(x=>[x.tgl,x.sale||'-',rp(x.amt)]))}];
RP.hks=['Rekap Hutang Konsinyasi',()=>gT(SI().filter(i=>pf(i.k).ko),i=>pf(i.k).sp||'-',['Supplier','Qty terjual','Hutang konsinyasi (harga pokok)'],v=>[sm(v,i=>i.q),rp(sm(v,i=>i.q*i.b))])];
['jsup','rdon','hks'].forEach(k=>LT[k]=RP[k][0]);
(()=>{const w=a=>a.forEach(i=>{if(i)Array.isArray(i[1])?w(i[1]):TT[i[1]]=i[0]});w(MN.flatMap(x=>x[1]||[]))})();
try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
render();pull();setInterval(pull,20000);
</script></body></html>
