if(t=='jual'){const l=S.sale.filter(s=>inr(s.tgl)),laba=l.reduce((a,s)=>a+s.total-(s.pp||0)-s.items.reduce((x,i)=>x+i.q*i.b,0),0);return cards([['Omzet',rp(l.reduce((a,s)=>a+s.total,0))],['Transaksi',l.length],['Estimasi laba',rp(laba)]])+tb(['No','Tanggal','Kasir','Member','Metode','Subtotal','Diskon','Total'],l.map(s=>[s.id,s.tgl,s.kasir,s.mn,s.met,rp(s.sub),rp(s.dm+s.dk),rp(s.total)]))}
if(t=='jualp'){const a={};S.sale.filter(s=>inr(s.tgl)).forEach(s=>s.items.forEach(i=>{const r=a[i.k]=a[i.k]||{n:i.n,q:0,o:0,l:0};r.q+=i.q;r.o+=i.q*i.h;r.l+=i.q*(i.h-i.b)}));return tb(['Produk','Qty Terjual','Omzet','Laba Kotor'],Object.values(a).sort((x,y)=>y.q-x.q).map(r=>[r.n,r.q,rp(r.o),rp(r.l)]))}
if(t=='beli'){const l=S.buy.filter(b=>inr(b.tgl));return cards([['Total pembelian',rp(l.reduce((a,b)=>a+b.total,0))],['Faktur',l.length]])+tb(['No','Tanggal','Supplier','Bayar','Total','Sisa'],l.map(b=>[b.id,b.tgl,b.sup,b.t,rp(b.total),rp(b.total-b.paid)]))}
if(t=='rbl'){const l=S.rb.filter(r=>inr(r.tgl));return cards([['Total retur',rp(l.reduce((a,r)=>a+r.nilai,0))]])+tb(['No','Tanggal','Supplier','Produk','Qty','Nilai'],l.map(r=>[r.id,r.tgl,r.sup,r.n,r.q,rp(r.nilai)]))}
if(t=='rjl'){const l=S.rs.filter(r=>inr(r.tgl));return cards([['Total retur',rp(l.reduce((a,r)=>a+r.nilai,0))]])+tb(['No','Tanggal','Transaksi','Produk','Qty','Nilai'],l.map(r=>[r.id,r.tgl,r.sale,r.n,r.q,rp(r.nilai)]))}
if(t=='hut'){const l=S.buy.filter(b=>b.total>b.paid);return cards([['Total hutang',rp(l.reduce((a,b)=>a+b.total-b.paid,0))]])+tb(['Faktur','Tanggal','Supplier','Total','Sisa'],l.map(b=>[b.id,b.tgl,b.sup,rp(b.total),rp(b.total-b.paid)]))}
if(t=='bayar'){const l=S.pay.filter(p=>inr(p.tgl));return cards([['Total dibayar',rp(l.reduce((a,p)=>a+p.amt,0))]])+tb(['No','Tanggal','Faktur','Supplier','Jumlah'],l.map(p=>[p.id,p.tgl,p.buy,p.sup,rp(p.amt)]))}
return cards([['Nilai persediaan',rp(S.prod.reduce((a,p)=>a+p.s*p.b,0))]])+tb(['Kode','Produk','Stok','Harga Beli','Nilai'],S.prod.map(p=>[p.k,p.n,p.s,rp(p.b),rp(p.s*p.b)]))}

try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
render();pull();setInterval(pull,20000);
