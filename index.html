const sd=s=>s.total-(s.pd??s.total);
VW.pel=()=>{const l=S.sale.filter(s=>sd(s)>0);return `<div class=hd><h2>Pelunasan / Cicilan Kredit</h2></div>`+cards([['Total piutang',rp(l.reduce((a,s)=>a+sd(s),0))]])+tb(['No','Tanggal','Member','Total','Dibayar','Sisa',''],l.map(s=>[s.id,s.tgl,s.mn,rp(s.total),rp(s.pd),rp(sd(s)),`<button class="bt pr" onclick="plx('${s.id}')">Bayar</button>`]))+`<h3 style="margin-bottom:10px">Riwayat Pelunasan</h3>`+tb(['Tanggal','Transaksi','Jumlah'],S.pel.slice().reverse().map(x=>[x.tgl,x.sale,rp(x.amt)]))};
const plx=id=>{const s=S.sale.find(x=>x.id==id);modal('Bayar Cicilan '+id,[['a','Jumlah','number',sd(s)]],o=>{const a=+o.a;if(a<=0||a>sd(s))return alert('Jumlah tidak valid'),false;s.pd=(s.pd??s.total)+a;S.pel.push({tgl:today(),sale:id,amt:a});sv();go()})};
/* CEK HARGA, KAS */
VW.cek=()=>`<div class=cd><input id=ck placeholder="Scan barcode / ketik nama barang" oninput="ckr(this.value)"><div id=cr style="margin-top:10px"></div></div>`;
const ckr=v=>{v=v.toLowerCase();$('#cr').innerHTML=v?tb(['Barcode','Nama','Harga','Jual2','Jual3','Stok'],S.prod.filter(p=>p.k.includes(v)||p.n.toLowerCase().includes(v)).slice(0,20).map(p=>[p.k,p.n,'<b>'+rp(p.h)+'</b>',rp(p.h2||p.h),rp(p.h3||p.h),p.s])):''};
VW.kas=()=>{const l=S.ex,ms=l.filter(x=>x.j=='masuk').reduce((a,x)=>a+x.amt,0),kl=l.reduce((a,x)=>a+(x.j=='masuk'?0:x.amt),0);return `<div class=hd><h2>Kas Keluar / Masuk</h2><button class="bt pr" onclick=nk()>+ Transaksi Kas</button></div>`+cards([['Kas masuk',rp(ms)],['Kas keluar',rp(kl)],['Saldo',rp(ms-kl)]])+tb(['Tanggal','Jenis','Kategori','Keterangan','Jumlah'],l.slice().reverse().map(x=>[x.tgl,x.j=='masuk'?'Masuk':'Keluar',x.k,x.ket,rp(x.amt)]))};
const nk=()=>modal('Kas',[['j','Jenis','select','keluar',[['keluar','Kas Keluar'],['masuk','Kas Masuk']]],['k','Kategori','select',null,(S.m.kkas.length?S.m.kkas.map(x=>x.n):['Listrik','Gaji','Sewa','Lainnya']).map(x=>[x,x])],['ket','Keterangan','text',''],['a','Jumlah','number',0]],o=>{if(+o.a<=0)return false;S.ex.push({tgl:today(),j:o.j,k:o.k,ket:o.ket,amt:+o.a});sv();go()});
/* KONVERSI & TRANSFER STOK */
const pS=()=>S.prod.map(p=>[p.k,p.n+' ('+p.s+')']);
VW.kv=()=>`<div class=hd><h2>Konversi Stok</h2><button class="bt pr" onclick=nkv()>+ Konversi</button></div>`+tb(['Tanggal','Dari','Qty','Menjadi','Qty'],S.kv.slice().reverse().map(x=>[x.tgl,x.a,x.qa,x.b,x.qb]));
const nkv=()=>modal('Konversi Stok',[['a','Dari barang','select',S.prod[0]?.k,pS()],['qa','Qty dikurangi','number',1],['b','Menjadi barang','select',S.prod[0]?.k,pS()],['qb','Qty ditambah','number',1]],o=>{const a=S.prod.find(p=>p.k==o.a),b=S.prod.find(p=>p.k==o.b),qa=+o.qa,qb=+o.qb;if(!a||!b||a==b||qa<=0||qb<=0||qa>a.s)return alert('Data tidak valid atau stok kurang'),false;a.s-=qa;b.s+=qb;S.kv.push({tgl:today(),a:a.n,qa,b:b.n,qb});sv();go()});
VW.tf=()=>`<div class=hd><h2>Transfer Stok</h2><button class="bt pr" onclick=ntf()>+ Transfer</button></div>`+tb(['No','Tanggal','Cabang Tujuan','Barang','Qty'],S.tf.slice().reverse().map(x=>[x.id,x.tgl,x.c,x.n,x.q]));
const ntf=()=>modal('Transfer Stok',[['c','Cabang tujuan','text',(S.m.cabang[0]||{}).n||''],['k','Barang','select',S.prod[0]?.k,pS()],['q','Qty','number',1]],o=>{const p=S.prod.find(x=>x.k==o.k),q=+o.q;if(!o.c||!p||q<=0||q>p.s)return alert('Data tidak valid atau stok kurang'),false;p.s-=q;S.tf.push({id:pid('TS'),tgl:today(),c:o.c,n:p.n,q});sv();go()});
VW.adj=()=>VW.opn();
/* AKUNTING */
const ak=k=>(S.m.akun.find(a=>a.k==k)||{}).n||'';
VW.jur=()=>`<div class=hd><h2>Jurnal Umum</h2><button class="bt pr" onclick=nj()>+ Jurnal</button></div>`+tb(['Tanggal','Keterangan','Debit','Kredit','Jumlah'],S.jur.slice().reverse().map(j=>[j.tgl,j.ket,j.d+' '+ak(j.d),j.k+' '+ak(j.k),rp(j.amt)]));
const nj=()=>{const A=S.m.akun.map(a=>[a.k,a.k+' '+a.n]);modal('Jurnal Umum',[['ket','Keterangan','text',''],['d','Akun Debit','select',null,A],['k','Akun Kredit','select',null,A],['a','Jumlah','number',0]],o=>{if(+o.a<=0||o.d==o.k)return alert('Jumlah atau akun tidak valid'),false;S.jur.push({tgl:today(),ket:o.ket,d:o.d,k:o.k,amt:+o.a});sv();go()})};
VW.sj=()=>`<p class=m>Nama akun diatur di Master Account. Kode akun yang dipakai saat posting otomatis:</p>`+tb(['Transaksi','Debit','Kredit'],[['Penjualan tunai / QRIS / debit','1-1000 Kas','4-1000 Penjualan'],['Penjualan kredit','1-3000 Piutang','4-1000 Penjualan'],['HPP','5-1000 HPP','1-2000 Persediaan'],['Pembelian tunai','1-2000 Persediaan','1-1000 Kas'],['Pembelian kredit','1-2000 Persediaan','2-1000 Hutang'],['Kas keluar','6-1000 Biaya','1-1000 Kas'],['Kas masuk','1-1000 Kas','4-1000 Pendapatan']]);
VW.post=()=>{const n=S.sale.filter(s=>!s.pst).length+S.buy.filter(b=>!b.pst).length+S.ex.filter(x=>!x.pst).length;return `<div class=cd><p>Transaksi belum diposting: <b>${n}</b></p><button class="bt pr" onclick=dpost()>Posting ke Jurnal</button></div>`};
const dpost=()=>{const J=(ket,d,k,amt)=>amt>0&&S.jur.push({tgl:today(),ket,d,k,amt});S.sale.filter(s=>!s.pst).forEach(s=>{J('Penjualan '+s.id,s.met=='Kredit'?'1-3000':'1-1000','4-1000',s.total-(s.pp||0));J('HPP '+s.id,'5-1000','1-2000',s.items.reduce((a,i)=>a+i.q*i.b,0));s.pst=1});S.buy.filter(b=>!b.pst).forEach(b=>{J('Pembelian '+b.id,'1-2000',b.t=='kredit'?'2-1000':'1-1000',b.total);b.pst=1});S.ex.filter(x=>!x.pst).forEach(x=>{x.j=='masuk'?J('Kas masuk '+x.k,'1-1000','4-1000',x.amt):J('Biaya '+x.k,'6-1000','1-1000',x.amt);x.pst=1});sv();alert('Posting selesai');go()};
VW.lak=()=>{const m={};S.jur.forEach(j=>{(m[j.d]=m[j.d]||{d:0,k:0}).d+=j.amt;(m[j.k]=m[j.k]||{d:0,k:0}).k+=j.amt});return `<h3 style="margin-bottom:10px">Neraca Saldo</h3>`+tb(['Kode','Akun','Debit','Kredit','Saldo'],Object.keys(m).sort().map(k=>[k,ak(k),rp(m[k].d),rp(m[k].k),rp(m[k].d-m[k].k)]))};
VW.lvl=()=>tb(['Level','Akses menu'],[['Pusat','Semua menu'],['Kasir',KS.filter(k=>TT[k]).map(k=>ttl(k)).join(', ')]]);
/* PRICE CARD */
let pcl=[];
const pcadd=(k,q=1)=>{const p=S.prod.find(x=>x.k==k||x.n.toLowerCase()==k.toLowerCase());if(!p)return alert('Barang tidak ditemukan');const x=pcl.find(y=>y.k==p.k);x?x.q+=q:pcl.push({k:p.k,n:p.n,h:p.h,q})};
VW.price=()=>`<div class=cd><div class=ac style="justify-content:flex-start;flex-wrap:wrap;margin:0"><input style="max-width:320px" placeholder="Scan / ketik barcode lalu Enter" onkeydown="if(event.key=='Enter'&&this.value){pcadd(this.value.trim());go()}"><button class=bt onclick=pcs()>+ Pilih Barang</button></div></div>`+tb(['Barcode / Kode Brg.','Nama Brg.','@Harga','QTY',''],pcl.map((x,i)=>[x.k,x.n,rp(x.h),`<input type=number value=${x.q} style="width:70px" onchange="pcl[${i}].q=+this.value||1">`,`<button class=bt onclick="pcl.splice(${i},1);go()">x</button>`]))+`<div class=ac style="justify-content:flex-start;flex-wrap:wrap"><button class=bt onclick="pcp(0)">Cetak Barcode</button><button class=bt onclick="pcp(1)">Cetak Label Rak</button><button class=bt onclick="pcp(2)">Cetak Format Besar</button><button class=bt onclick="pcl=[];go()">Clear</button><button class=bt onclick="nav('dash')">Close</button></div>`;
const pcs=()=>modal('Pilih Barang',[['k','Barang','select',S.prod[0]?.k,pS()],['q','Qty','number',1]],o=>{pcadd(o.k,+o.q||1);go()});
const pcp=m=>{if(!pcl.length)return alert('Daftar kosong');printHTML(`<div class=pg>${pcl.flatMap(x=>Array(x.q).fill(x)).map(x=>`<div class="pcd ${m==2?'big':''}"><div>${m?S.set.n+'<br>':''}${x.n}</div>${m?`<b>${rp(x.h)}</b>`:''}<small>${x.k}</small>${bar(x.k)}</div>`).join('')}</div>`)};
try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
render();pull();setInterval(pull,20000);
</script></body></html>
